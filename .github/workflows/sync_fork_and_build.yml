name: Sync fork and build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: sync-fork-and-build
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  sync-and-build:
    name: Sync fork and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync from upstream
        id: sync
        run: |
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git remote add upstream https://github.com/MorpheApp/morphe-patches.git
          git fetch upstream dev
          if ! git merge --no-commit --no-ff -X ours upstream/dev; then
            echo "::warning::Upstream merge conflicted; keeping the current dev branch."
            git merge --abort
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout HEAD -- .github/workflows
          git add -A
          if git diff --cached --quiet; then
            echo "No upstream changes to sync."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Build merged tree
        id: merged_build
        continue-on-error: true
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: Commit verified sync
        if: steps.merged_build.outcome == 'success' && steps.sync.outputs.has_changes == 'true'
        run: |
          git commit -m "Sync upstream dev"
          git push origin HEAD:dev

      - name: Restore current dev after incompatible sync
        if: steps.merged_build.outcome == 'failure'
        run: git reset --hard "${{ steps.sync.outputs.base_sha }}"

      - name: Build current dev fallback
        if: steps.merged_build.outcome == 'failure'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: morphe-patches
          archive: false
          path: patches/build/libs
